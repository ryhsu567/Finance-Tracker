# Canonical category taxonomy. Hand-edited — the loader validates every
# transaction's raw category against this file and FAILS LOUDLY on anything
# unmapped (SPEC §6.1). A silently dropped transaction is the bug this
# project exists to prevent.
#
# cadence drives which progress metric the dashboard shows (SPEC §5):
#   fixed    - binary paid/not-paid, no percentage bar
#   variable - pace-adjusted vs day-of-month
#   lumpy    - sinking fund: target accrues monthly, spending draws it down
# cadence only applies to expense categories.
#
# Decision (SPEC §11): merged three sparse/inconsistent categories into a
# same-cadence sibling (sweet_treat stays separate from eating_out,
# overriding an earlier attempt to fold it in):
#   insurance -> utilities   (both baseline/variable, insurance is $0 so far)
#   flights -> travel        (both lumpy, flights *is* trip spend)
#   move_in -> shopping      (both lumpy, one-off purchases either way)
#
# Decision (SPEC §11): `going_out` renamed `entertainment` and widened —
# `other` was hiding real recreational spend (Bay to Breakers, Movies,
# Vegas Gambling, Tennis, Running Gels) under the same raw "Other" label as
# annual fees/subscriptions/personal care, because the source sheet's
# Category column can't tell them apart. See raw_expense_description_labels
# below for the description-based split (same trick as income's `Other`).
# 11 expense categories total.

expense:
  housing:
    rent:           { budget_group: baseline,      cadence: fixed }
    utilities:      { budget_group: baseline,      cadence: variable }
  food_in:
    # Decision (2026-08-11): moved from `baseline` to `discretionary` (user
    # preference) - pooled with the other discretionary categories now,
    # checked per-category before.
    groceries:      { budget_group: discretionary, cadence: variable }
  transport:
    # Decision (2026-10-23): moved from `baseline` to `discretionary` (user
    # preference) - ride-share/transit/parking are day-to-day choices, so
    # they belong in the pooled check, not a per-category baseline one.
    # reconcile.py's BASELINE_CATS deliberately still lists transportation:
    # it reproduces the *source sheet's* historical baseline to validate the
    # migration arithmetic, and is not a statement about current grouping.
    transportation: { budget_group: discretionary, cadence: variable }
  food_out:
    eating_out:     { budget_group: discretionary, cadence: variable }
    sweet_treat:    { budget_group: discretionary, cadence: variable }
  social:
    entertainment:  { budget_group: discretionary, cadence: variable }
  health:
    # Decision (2026-08-11, overrides the §11/§7.6 `lumpy` call): user
    # preference is a flat monthly pace for gym like the rest of
    # discretionary, not an annualized YTD read. Pooled with the others now.
    gym:            { budget_group: discretionary, cadence: variable }
  personal:
    shopping:       { budget_group: discretionary, cadence: variable }
    other:          { budget_group: discretionary, cadence: variable }
  travel:
    # Decision (2026-11-10, re-reverses the 2026-08-11 flip to `variable`
    # for travel only): travel is saved up for over months and then spent
    # in one lump, so a flat monthly pace misreads it - a single $950
    # flight booking read as November's whole discretionary pool being
    # blown on the 10th. Back to `lumpy`, and excluded from the paced pool
    # (SPEC §5, "a trip is one decision, not a monthly overrun"). `lumpy`
    # now reads as a sinking fund (user decision 2026-11-11): the $150/mo
    # target accrues into a bucket and trips draw it down, so the Budget
    # page shows a balance instead of a percentage. gym and shopping stay `variable`/pooled - the 2026-08-11
    # preference still holds for those two.
    travel:         { budget_group: discretionary, cadence: lumpy }

income:
  salary: {}
  gift: {}
  side_hustle: {}
  tax_refund: {}
  reimbursement: {}
  resale: {}

transfer:
  stock_sale: {}
  deposit_return: {}

# Contribution accounts for kind=investment (SPEC §7.4, answered 2026-10-14:
# real dated rows, not monthly lump sums — entered through the Import tab,
# there are no investment rows in the source spreadsheets to map). The
# Budget sheet's 70/20/10 brokerage/emergency/crypto split is *descriptive*
# (user decision 2026-10-14), not an allocation target, so the dashboard
# charts the actual mix and draws no target line. 401k/Roth payroll
# *payroll* contributions are deliberately out of scope: they never appear as
# cash transactions, so mixing them in would make the cash-flow-vs-investing
# comparison dishonest. A Roth IRA funded by a transfer out of checking is the
# opposite case — real cash leaves the bank on a real date — so it belongs
# here (added 2026-10-15).
#
# Order matters: it is the stacking and legend order on the Investments tab,
# and the palette is validated on *adjacent* pairs. roth_ira (yellow) sits
# second, next to brokerage (blue), because yellow beside crypto (orange)
# fails CVD separation outright — ΔE 4.8 on the dark surface.
investment:
  brokerage: {}
  roth_ira: {}
  emergency_fund: {}
  crypto: {}

# --- raw label -> canonical category -------------------------------------

# Expenses tab `Category` column, verbatim -> canonical category.
raw_expense_labels:
  Rent: rent
  Groceries: groceries
  Utilities: utilities
  Insurance: utilities         # merged (SPEC §11) — always $0 so far
  Transportation: transportation
  Flights: travel               # merged (SPEC §11) — flights are trip spend
  "Eating Out": eating_out
  Food: eating_out              # known bug (SPEC §6.1): "Lunch w/ Shashank" mistyped, silently dropped by the old summary
  "Sweet Treat": sweet_treat
  "Going Out": entertainment    # renamed (SPEC §11)
  Gym: gym
  Shopping: shopping
  Sho: shopping                 # typo, one row ("Haus Beater")
  Other: other                  # default; specific rows overridden below by description
  Gambling: entertainment       # renamed (SPEC §11) — was folded into `other`
  Travel: travel
  "Move-in": shopping           # merged (SPEC §11) — one-off purchases either way

# These win over the `Category` column, whatever it says. The raw sheet files
# recreational spend under the same "Other" label as annual fees/subscriptions/
# personal care, so only the description can tell them apart (same trick as
# income's `Other` below) — and the column is sometimes just wrong, which is a
# second reason to trust an unambiguous description over the label.
#
# Keys match the description IGNORING CASE (user decision, 2026-10-25): the
# descriptions are hand-typed, so the same payee arrives as HEYTEA, HeyTea and
# Heytea. Two keys differing only in case but disagreeing on the category are
# an error the loader refuses to guess past.
raw_expense_description_labels:
  "Bay to Breakers": entertainment
  Movies: entertainment
  "Tennis Balls": entertainment
  "Tennis Lights": entertainment
  "Running Gels": entertainment
  Badminton: entertainment      # entered under "Gym" in the source sheet (user decision, 2026-10-16)
  HEYTEA: sweet_treat            # bubble tea/dessert, not a meal (user decision, 2026-09-09)

# Income tab: the raw `Category` column only has 4 distinct values
# (Deloitte / Other / Holidays / Side Hustle?) — everything else is filed
# under "Other" and must be distinguished by the `Income` description column.
raw_income_category_labels:
  Deloitte: salary
  Holidays: gift
  "Side Hustle?": side_hustle

raw_income_description_labels:       # only checked when Category == "Other"
                                     # matched ignoring case, as above
  Underdog: resale
  "FB Marketplace BS": resale
  "Eye Medical Reimbursement": reimbursement
  "Tax Refund - Federal": tax_refund
  "Tax Refund - State": tax_refund
  "Stock Money": stock_sale          # kind: transfer, not income
  "Security Deposit": deposit_return # kind: transfer, not income
